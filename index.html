<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="carousel" content="A simple carousel component using HTML, CSS, and JavaScript.">
	<link rel="stylesheet" href="style.css">
	<script src="script.js"></script>
	<title>Document</title>
</head>

<body>
	<div class="gui-carousel" carousel-pagination="dots" carousel-controls="auto" carousel-scrollbar="auto"
		carousel-snapstop="auto" aria-label="Featured Items Carousel">
		<div class="gui-carousel--scroller">

			<div class="gui-carousel--snap">
				<figure class="animate-visibility captioned-image">
					<img loading="lazy" width="100%" height="720" src="https://picsum.photos/seed/this/1280/720.webp"
						alt="Blue ocean with a large wave">
					<figcaption>
						<a href="#">Learn more about large ocean waves</a>
					</figcaption>
				</figure>
			</div>

			<div class="gui-carousel--snap">
				<figure class="animate-visibility captioned-image">
					<img loading="lazy" width="100%" height="720" src="https://picsum.photos/seed/is/1280/720.webp"
						alt="Frosty orange desert sunset">
					<figcaption>
						<a href="#">Learn more about warm deserts</a>
					</figcaption>
				</figure>
			</div>

			<div class="gui-carousel--snap">
				<figure class="animate-visibility captioned-image">
					<img loading="lazy" width="100%" height="720" src="https://picsum.photos/seed/a/1280/720.webp"
						alt="African sahara with a giraffe">
					<figcaption>
						<a href="#">Learn more about giraffe's</a>
					</figcaption>
				</figure>
			</div>

		</div>
	</div>
</body>

</html>
